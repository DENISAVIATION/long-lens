# Temporary: makes voice-over clips for the Long Lens Reel with the open-source Kokoro TTS model.
name: Voice clips
on:
  push:
    branches: [voice-tmp]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - run: pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -q kokoro==0.9.4 soundfile==0.12.1
      - run: python voice/tts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f out/*.wav
          git commit -m "Voice clips"
          git push
